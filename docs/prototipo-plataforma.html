<div class="project"><span>IM</span><div>Meu laboratório<small>Workspace local</small></div></div>

<div class="shell"><header class="topbar"><div class="toolbar"><button class="iconbtn mobile-menu" data-action="menu" aria-label="Abrir menu" aria-controls="sidebar" aria-expanded="false" id="menu-button"></button><div class="breadcrumb" id="breadcrumb"></div></div><div class="toolbar"><span class="badge">Uso individual</span><span class="avatar" aria-label="Workspace de Gabriel">GA</span></div></header>
<div class="demo-banner"><span><strong>Protótipo interativo</strong> · Resultados, custos e execuções são fictícios. Nenhum modelo é executado.</span><button class="banner-link" data-action="help">O que posso testar?</button></div>
<main id="main" class="workspace" tabindex="-1"></main></div>
<dialog class="modal" id="dialog" aria-labelledby="dialog-title"><div class="modalhead"><h2 id="dialog-title"></h2><button class="iconbtn" data-action="close-dialog" aria-label="Fechar janela" id="close-icon"></button></div><div class="modalbody" id="dialog-body"></div><div class="modalfoot" id="dialog-footer"></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<noscript><p style="padding:24px;margin-left:240px">Este protótipo precisa de JavaScript para demonstrar navegação e edição. Nenhuma chamada externa é necessária.</p></noscript>
<script>
const icons={grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',book:'<path d="M4 3h12a3 3 0 0 1 3 3v15H7a3 3 0 0 1-3-3V3Z"/><path d="M4 17h15M8 7h7M8 11h5"/>',flask:'<path d="M9 3h6M10 3v7l-6 9a1.3 1.3 0 0 0 1 2h14a1.3 1.3 0 0 0 1-2l-6-9V3M7 15h10"/>',prompt:'<path d="M4 4h16v13H9l-5 4V4Z"/><path d="m8 8 3 2-3 2m5 0h3"/>',graph:'<circle cx="5" cy="6" r="3"/><circle cx="19" cy="5" r="3"/><circle cx="12" cy="19" r="3"/><path d="m8 6 8-1M6 9l4 7m7-8-4 8"/>',settings:'<path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/>',check:'<path d="m5 12 4 4L19 6"/>',plus:'<path d="M12 5v14M5 12h14"/>',copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M15 8V4H4v11h4"/>',play:'<path d="m8 4 12 8-12 8V4Z"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/>',chevron:'<path d="m9 5 7 7-7 7"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 1 1 4 3c-1 .5-1 1-1 2m0 3v.1"/>',monitor:'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',save:'<path d="M4 3h13l3 3v15H4V3Z"/><path d="M8 3v6h8V3M8 21v-7h8v7"/>',file:'<path d="M5 2h9l5 5v15H5V2Z"/><path d="M14 2v6h5M9 12h6m-6 4h6"/>',cut:'<path d="M4 4h16v5H4zm0 11h16v5H4zM7 12h10"/>',spark:'<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5L12 3Z"/>',vector:'<path d="M5 3v18M12 3v18M19 3v18"/><circle cx="5" cy="9" r="2"/><circle cx="12" cy="16" r="2"/><circle cx="19" cy="6" r="2"/>',search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/>',json:'<path d="M8 3H5v7l-2 2 2 2v7h3m8-18h3v7l2 2-2 2v7h-3"/>',shield:'<path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z"/><path d="m8 12 3 3 5-6"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/>',compare:'<path d="M4 4h6v16H4zm10 4h6v12h-6z"/>',pause:'<path d="M8 4v16M16 4v16"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.1"/>',refresh:'<path d="M20 7v5h-5M4 17v-5h5"/><path d="M6 6a8 8 0 0 1 14 6M4 12a8 8 0 0 0 14 6"/>'};
const icon=(name,size=18)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.grid}</svg>`;
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'USD'}).format(n);
const number=n=>new Intl.NumberFormat('pt-BR').format(n);
const clone=value=>JSON.parse(JSON.stringify(value));
const graphPrompt='Extraia entidades, relações e eventos dos trechos fornecidos.\n\nPara cada afirmação:\n• Identifique sujeito, relação, objeto e papéis.\n• Distinga alegação, decisão e referência a outro processo.\n• Preserve quem disse, a data e eventuais negações.\n• Inclua chunk_id e uma citação literal que sustente a relação.\n• Se houver ambiguidade, registre-a sem resolver por suposição.\n\nTrechos: {{passages}}\nFormato esperado: {{schema}}';
const answerPrompt='Responda ao campo usando apenas as evidências fornecidas.\nVerifique o processo principal e o papel de cada entidade.\nInclua uma citação literal para cada valor preenchido.\nSe faltar suporte, retorne null e descreva a informação ausente.\n\nPergunta: {{question}}\nEvidências: {{passages}}\nSchema: {{schema}}';
const initialConfig={name:'Grafo com contexto',version:2,parser:'PyMuPDF',chunk:1800,overlap:200,pack:10000,graphModel:'GPT-6 Luna',graphPrompt,graphEnabled:true,resolve:true,summaryModel:'Qwen3:4b',summaryPrompt:'Resuma o conteúdo preservando pessoas, atribuições, datas e ressalvas.\nNão trate alegações como decisões.\n\nTrechos: {{passages}}',embedModel:'text-embedding-3-large',dimension:1536,search:'Híbrida + grafo',topk:8,depth:2,rerank:true,answerModel:'GPT-6 Luna',answerPrompt,rounds:3,verifyModel:'GPT-6 Sol',verifyPrompt:'Confira se cada resposta é sustentada pelas citações e corresponde à pergunta, ao processo e ao papel correto.\n\nResposta: {{answer}}\nEvidências: {{passages}}',documents:['adpf54','dom-casmurro']};
const defaultMatrix={prompts:['Resposta v1','Resposta v2'],models:['Qwen3:4b','GPT-6 Luna'],embeddings:['EmbeddingGemma:300m','text-embedding-3-large'],topks:['4','8','12'],documents:['adpf54','dom-casmurro'],repetitions:3};
const defaults=()=>({config:clone(initialConfig),versions:[{version:1,name:'Busca híbrida',note:'Referência ilustrativa',config:{...clone(initialConfig),name:'Busca híbrida',version:1,graphEnabled:false,answerModel:'Qwen3:4b',embedModel:'EmbeddingGemma:300m',topk:4}},{version:2,name:'Grafo com contexto',note:'Configuração de demonstração',config:clone(initialConfig)}],matrix:clone(defaultMatrix),jobs:[],batchState:'empty',dirty:false,impact:'graph'});
let state=defaults();let persistence=true;const storageKey='indexing-methods-ui-prototype-v1';
try{const raw=JSON.parse(localStorage.getItem(storageKey)||'null');if(raw?.config&&Array.isArray(raw.versions)&&raw.matrix&&Array.isArray(raw.jobs))state={...state,...raw};}catch{persistence=false;}
let page='experimentos',tab='config',stage='graph',runFilter='',runSearch='',runPage=0,compareDocument='adpf54',baseline='hybrid',candidate='graph',graphNode='claim',toastTimer;
const saveLocal=()=>{try{localStorage.setItem(storageKey,JSON.stringify(state));}catch{persistence=false;}};
const notify=message=>{const e=document.getElementById('toast');e.textContent=message;e.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.hidden=true,4200);};
const btn=(label,action,kind='',extra='')=>`<button class="btn ${kind}" data-action="${action}" ${extra}>${label}</button>`;
const selectField=(label,key,options,help='')=>`<label class="field"><span>${label}</span><select data-config="${key}" aria-label="${label}">${options.map(v=>`<option ${String(state.config[key])===String(v)?'selected':''}>${esc(v)}</option>`).join('')}</select>${help?`<small>${help}</small>`:''}</label>`;
const numField=(label,key,min,max,help='')=>`<label class="field"><span>${label}</span><input type="number" min="${min}" max="${max}" data-config="${key}" value="${esc(state.config[key])}" aria-label="${label}">${help?`<small>${help}</small>`:''}</label>`;
const toggle=(label,key,help='')=>`<label class="checkbox-line"><input type="checkbox" data-config="${key}" ${state.config[key]?'checked':''}><span>${label}${help?`<small class="check-help">${help}</small>`:''}</span></label>`;
const promptEditor=(key,label)=>`<div class="prompt-head"><label class="field-label" for="${key}">${label}</label>${btn('Ver prévia','preview-prompt','ghost',`data-key="${key}"`)}</div><textarea id="${key}" data-config="${key}" spellcheck="false">${esc(state.config[key])}</textarea><div class="prompt-foot"><span>Variáveis entre {{chaves}} serão preenchidas na execução.</span><span id="prompt-length" class="tokens">${number(state.config[key].length)} caracteres</span></div>`;
const stages=[['parse','file','Leitura do PDF'],['chunk','cut','Recortes e pacotes'],['graph','graph','Entidades e relações'],['summary','spark','Resumos'],['embed','vector','Embeddings'],['search','search','Recuperação'],['answer','json','Extração JSON'],['verify','shield','Verificação']];
function stageBody(){const models=['Qwen3:4b','GPT-6 Luna','GPT-6 Sol'];switch(stage){
case 'parse':return `<p class="stage-intro">Escolha como o texto e sua estrutura serão extraídos. A origem de cada trecho acompanha as próximas etapas.</p>${selectField('Extrator de texto','parser',['PyMuPDF','Parser estrutural','OCR + estrutura'],'Opções ilustrativas; nenhum parser será executado aqui.')}<div class="hint">${icon('info')}<span>Os dois PDFs do projeto já têm texto. Uma versão futura permitirá conferir texto e página lado a lado.</span></div><div class="formgrid"><div class="field"><span>Origem preservada</span><span class="badge green">Documento, página e posição</span></div><div class="field"><span>Versionamento</span><span class="badge">Hash do arquivo e do parser</span></div></div>`;
case 'chunk':return `<p class="stage-intro">A unidade usada para procurar pode ser menor que o pacote enviado ao modelo para extrair relações.</p><div class="formgrid mb">${numField('Tamanho do recorte','chunk',100,12000,'Caracteres por recorte.')}${numField('Sobreposição','overlap',0,11000,'Precisa ser menor que o recorte.')}</div>${numField('Pacote para extrair relações','pack',1000,100000,'Caracteres por chamada de extração do grafo.')}<div class="hint">${icon('cut')}<span>Alterar os recortes refaz embeddings, resumos e grafo. A leitura original do PDF pode ser reaproveitada.</span></div>`;
case 'graph':return `<p class="stage-intro">Defina como transformar o texto em entidades, eventos e relações com evidências.</p><div class="formgrid mb">${selectField('Modelo de extração','graphModel',models,'Modelos de exemplo; provedores não conectados.')}<div class="field"><span>Schema de saída</span><button class="btn full" data-action="schema">${icon('json')} Entidades e relações · v2</button><small>Ver estrutura e campos de evidência.</small></div></div>${promptEditor('graphPrompt','Prompt de entidades e relações')}<div class="rule"></div>${toggle('Construir e consultar o grafo','graphEnabled','A busca poderá usar as relações desta configuração.')}${toggle('Resolver nomes e referências','resolve','Demonstra a opção de ligar menções à mesma entidade.')}<div class="hint">${icon('shield')}<span>Cada relação deve manter sua evidência. Uma citação existente não basta para provar que a relação está correta.</span></div>`;
case 'summary':return `<p class="stage-intro">Crie resumos como pistas de navegação. O texto original continua disponível para sustentar as respostas.</p>${selectField('Modelo de resumo','summaryModel',models)}${promptEditor('summaryPrompt','Prompt de resumo')}<div class="hint">${icon('info')}<span>Resumo e extração de relações serão etapas separadas para medir seus custos individualmente.</span></div>`;
case 'embed':return `<p class="stage-intro">Escolha como representar o sentido dos recortes. Consultas e documentos precisam usar configurações compatíveis.</p><div class="formgrid mb">${selectField('Modelo de embedding','embedModel',['EmbeddingGemma:300m','text-embedding-3-large','Gemini Embedding'],'Catálogo demonstrativo, sem chamada externa.')}${selectField('Dimensões','dimension',state.config.embedModel==='EmbeddingGemma:300m'?[768]:[768,1536,3072])}</div><div class="hint">${icon('vector')}<span>Trocar o embedding refaz os vetores e o índice vetorial. Texto, recortes e grafo independentes podem ser reaproveitados.</span></div><div class="field"><span>Conteúdo vetorizado</span><p class="small muted">Texto original dos recortes. Resumos ficam em um canal separado.</p></div>`;
case 'search':return `<p class="stage-intro">Controle quais pistas entram no contexto do leitor e como o grafo participa da investigação.</p>${selectField('Estratégia de recuperação','search',['BM25','Vetorial','Híbrida','Híbrida + grafo','Híbrida + resumos + grafo'])}<div class="formgrid mb">${numField('Trechos por rodada (top_k)','topk',1,30)}${numField('Profundidade do grafo','depth',1,4,'Limite de relações percorridas.')}</div>${toggle('Reordenar os candidatos antes da leitura','rerank','Demonstra o uso de um reranqueador dedicado.')}<div class="hint">${icon('graph')}<span>A comparação mostrará quais evidências vieram somente do grafo e quais chegaram à resposta.</span></div>`;
case 'answer':return `<p class="stage-intro">Defina como preencher cada campo do formulário usando as evidências recuperadas.</p><div class="formgrid mb">${selectField('Modelo de resposta','answerModel',models)}${numField('Máximo de rodadas','rounds',1,8,'Busca e leitura por campo.')}</div>${promptEditor('answerPrompt','Prompt de extração JSON')}<div class="hint">${icon('json')}<span>Campos sem suporte permanecem com null e um motivo. Encontrar alguns itens não garante uma lista completa.</span></div>`;
case 'verify':return `<p class="stage-intro">Confira o suporte da resposta e mantenha a revisão separada da extração.</p>${selectField('Modelo de verificação','verifyModel',models)}${promptEditor('verifyPrompt','Prompt de verificação')}<div class="hint">${icon('shield')}<span>O juiz automático será comparado com referências humanas. Aprovação do modelo não é garantia de acerto.</span></div>`;
}}
function impacts(){const changed=state.impact;const all=changed==='parse',chunks=all||changed==='chunk';return [['Texto e estrutura',all],['Recortes',chunks],['Embeddings',chunks||changed==='embed'],['Resumos',chunks||changed==='summary'],['Relações e grafo',chunks||changed==='graph'],['Busca e extração',changed!=='verify'],['Verificação',true]].map(([label,rebuild])=>`<div class="impact-row"><span>${label}</span><span class="${rebuild?'rebuild':'reuse'}">${rebuild?'Recalcular':'Reaproveitar'}</span></div>`).join('');}
function editorView(){const s=stages.find(x=>x[0]===stage);return `<div class="editor-layout"><section class="card editor"><nav class="stage-nav" aria-label="Etapas da configuração"><p class="meta">Etapas do método</p>${stages.map(([id,i,label])=>`<button class="stage ${stage===id?'active':''}" data-action="stage" data-stage="${id}" aria-pressed="${stage===id}">${icon(i,17)}${label}</button>`).join('')}</nav><div class="editor-main"><div class="cardhead"><div class="stage-title"><span class="stage-icon">${icon(s[1],20)}</span><h2>${s[2]}</h2></div><span class="badge" id="draft-badge">${state.dirty?'Alterações locais':'Versão '+state.config.version}</span></div><div class="cardbody">${stageBody()}<div class="error" id="config-error" role="alert"></div></div><div class="editor-footer"><span>As alterações não afetam versões anteriores.</span>${btn('Próxima etapa','next-stage','',`aria-label="Próxima etapa da configuração"`)}</div></div></section><aside class="aside"><section class="card sidecard"><div class="cardbody"><h3>Conjunto de dados</h3><div class="docmini">${icon('file')}<div>ADPF 54<small>Acórdão · 433 páginas · 24 campos</small></div></div><div class="docmini">${icon('book')}<div>Dom Casmurro<small>Literatura · 105 páginas · 16 campos</small></div></div><div class="rule" style="margin:14px 0"></div><p class="meta">Gabarito demonstrativo na interface. O gabarito real ainda precisa de revisão.</p></div></section><section class="card sidecard"><div class="cardbody"><h3>Impacto da alteração</h3><p class="meta" style="margin-bottom:12px">Prévia das dependências da etapa editada.</p><div id="impact-list">${impacts()}</div></div></section><p class="rightnote">${icon('info',15)} A execução reutilizará apenas artefatos compatíveis. Neste protótipo, este painel explica o comportamento planejado.</p></aside></div><div class="footer-actions"><p>Edite uma etapa ou combine alternativas na matriz.</p>${btn('Montar matriz de testes','tab','primary','data-tab="matrix"')}</div>`;}
function axis(title,key,values,help=''){return `<div class="axis"><div><p>${title}</p>${help?`<small>${help}</small>`:''}</div><div class="chips">${values.map(([value,label])=>`<label class="choice"><input type="checkbox" data-axis="${key}" value="${esc(value)}" ${state.matrix[key].includes(value)?'checked':''}>${label}</label>`).join('')}</div></div>`;}
function counts(){const m=state.matrix;const combinations=m.prompts.length*m.models.length*m.embeddings.length*m.topks.length;return{combinations,runs:combinations*m.documents.length*m.repetitions,vectors:m.embeddings.length*m.documents.length,docs:m.documents.length};}

const duration=seconds=>seconds==null?'—':seconds<60?seconds+' s':Math.floor(seconds/60)+' min'+(seconds%60?' '+seconds%60+' s':'');
function timingProfile(key,document,mode){
  const values={...timingFixtures[key]};
  if(document==='dom-casmurro'){
    for(const stage of timingStages)if(stage.group==='Indexação'&&values[stage.id]!=null)values[stage.id]=Math.round(values[stage.id]*.6);
    values.search-=4;values.json-=12;values.verify-=4;values.evaluate-=2;
  }
  const rows=timingStages.map(stage=>{
    const historical=values[stage.id],skipped=historical==null,reused=!skipped&&stage.group==='Indexação'&&mode==='reuse';
    return {...stage,historical,seconds:skipped?null:reused?0:historical,status:skipped?(stage.id==='ocr'?'Não necessário':'Desativado'):reused?'Reaproveitado':'Executado'};
  });
  const sum=group=>rows.filter(row=>!group||row.group===group).reduce((total,row)=>total+(row.seconds||0),0);
  return {rows,total:sum(),index:sum('Indexação'),extract:sum('Extração'),queue:sum('Espera'),evaluation:sum('Avaliação'),active:sum()-sum('Espera')};
}
function timeCell(row){

function timeDelta(a,b){
  if(a==null||b==null)return '<span class="muted">Não comparável</span>';
  const delta=b-a;
  return `<span class="timing-delta ${delta>0?'slower':delta<0?'faster':''}">${delta>0?'+':''}${delta} s</span><small>${delta>0?'Mais demorado':delta<0?'Mais rápido':'Mesmo tempo'}${a&&delta?' · '+Math.abs(delta/a*100).toFixed(1).replace('.',',')+'%':''}</small>`;
}

function graphView(){return `<div class="pagehead"><div><h1>Laboratório do grafo</h1><p>Inspecione relações, papéis e a origem de cada afirmação.</p></div>${btn('Editar construção','edit-prompt','','data-stage="graph"')}</div><div class="hint warning" style="margin-top:0">${icon('info')}<span>Este grafo é fictício e demonstra a interação. Para ver o grafo medido da PoC, abra o <a href="../reports/full/grafo.html">relatório histórico</a>.</span></div><div class="graph-layout"><section class="card"><div class="cardhead"><h2>Relações com evidência</h2><span class="badge">Clique em um nó</span></div><div class="graph-canvas"><svg viewBox="0 0 720 390" aria-label="Grafo demonstrativo navegável"><g stroke="#9ab5a3" stroke-width="1.5" fill="none"><path d="M195 110H275M445 110H515M360 143V240M100 142V300H235"/></g><g fill="#62776a" font-size="12"><text x="206" y="98">sujeito</text><text x="464" y="98">objeto</text><text x="372" y="202">evidência</text></g>${[['subject',20,78,175,'Associação Aurora','Organização'],['claim',275,78,170,'Apresentou pedido','Afirmação'],['object',515,78,185,'Pedido inicial','Objeto'],['source',275,240,220,'Trecho de origem','Citação e localização'],['event',20,290,215,'Participação posterior','Outro papel no processo']].map(([id,x,y,w,title,sub])=>`<g class="graph-node" role="button" tabindex="0" data-action="graph-node" data-node="${id}" aria-label="${title}" aria-pressed="${graphNode===id}"><rect x="${x}" y="${y}" width="${w}" height="64" rx="7"/><text x="${x+14}" y="${y+26}">${title}</text><text class="sub" x="${x+14}" y="${y+46}">${sub}</text></g>`).join('')}</svg></div><div class="legend"><span><i class="swatch"></i>Entidade / evento</span><span><i class="swatch" style="background:var(--mint)"></i>Selecionado</span><span>Fontes ligadas às afirmações</span></div></section><aside class="aside"><section class="card"><div class="cardbody" id="graph-detail"></div></section></aside></div>`;}
function renderGraphDetail(){const e=document.getElementById('graph-detail');if(!e)return;const f=graphFacts[graphNode];e.innerHTML=`<span class="badge amber">Exemplo fictício</span><h2 style="margin:18px 0 8px">${f.title}</h2><p class="meta">${f.type}</p><p class="small" style="margin-top:20px">${f.text}</p><blockquote class="quote">${f.quote}</blockquote><p class="meta">Na versão funcional, seriam exibidos documento, página, offsets, modelo e versão do prompt.</p>`;}
function render(){document.getElementById('navigation').innerHTML=[['biblioteca','book','Biblioteca','2'],['experimentos','flask','Experimentos',''],['prompts','prompt','Prompts','4'],['grafo','graph','Grafo','']].map(([id,i,label,count])=>`<button class="navbutton ${page===id?'active':''}" data-action="nav" data-page="${id}" ${page===id?'aria-current="page"':''}>${icon(i)}${label}${count?`<span class="count">${count}</span>`:''}</button>`).join('');document.getElementById('breadcrumb').innerHTML=`<span>Meu laboratório</span>${icon('chevron',13)}<strong>${({biblioteca:'Biblioteca',experimentos:'Experimentos',prompts:'Prompts',grafo:'Grafo'})[page]}</strong>`;
let content='';if(page==='experimentos'){const tabs=[['config','settings','Configuração'],['matrix','grid','Matriz de testes'],['runs','clock','Execuções'],['compare','compare','Comparação']];content=`<div class="pagehead"><div><div class="titleline"><h1 id="experiment-title">${esc(state.config.name)}</h1><span class="badge ${state.dirty?'amber':'green'}" id="version-label">${state.dirty?'Rascunho alterado':'Configuração v'+state.config.version}</span></div><p>Compare métodos sobre os mesmos documentos, com evidência em cada resposta.</p></div><div class="toolbar">${btn(icon('copy',16)+' Duplicar','duplicate')}${btn(icon('save',16)+' Salvar versão','save-version','primary')}</div></div><nav class="tabs" aria-label="Seções do experimento">${tabs.map(([id,i,label])=>`<button class="tab ${tab===id?'active':''}" data-action="tab" data-tab="${id}" aria-current="${tab===id?'page':'false'}">${icon(i,16)}${label}${id==='runs'&&state.jobs.length?`<small>${state.jobs.length}</small>`:''}</button>`).join('')}</nav>${tab==='config'?editorView():tab==='matrix'?matrixView():tab==='runs'?runsView():compareView()}`;}else if(page==='biblioteca')content=libraryView();else if(page==='prompts')content=promptsView();else content=graphView();document.getElementById('main').innerHTML=content;renderRunRows();renderGraphDetail();if(tab==='matrix'&&page==='experimentos')updateMatrix();if(tab==='config'&&page==='experimentos')validateConfig();}
function validateConfig(){const c=state.config;const errors=[];if(!Number.isFinite(c.chunk)||c.chunk<100)errors.push('O recorte precisa ter pelo menos 100 caracteres.');if(!Number.isFinite(c.overlap)||c.overlap<0||c.overlap>=c.chunk)errors.push('A sobreposição deve ser maior ou igual a zero e menor que o recorte.');if(!Number.isFinite(c.pack)||c.pack<1000)errors.push('O pacote precisa ter pelo menos 1.000 caracteres.');if(c.topk<1||c.topk>30)errors.push('Escolha de 1 a 30 trechos por rodada.');if(c.rounds<1||c.rounds>8)errors.push('Escolha de 1 a 8 rodadas.');if(['graphPrompt','answerPrompt','summaryPrompt','verifyPrompt'].some(key=>!c[key].trim()))errors.push('Os prompts não podem ficar vazios.');const box=document.getElementById('config-error');if(box)box.textContent=errors.join(' ');return errors;}
function markChanged(key){state.dirty=true;state.impact=stage;saveLocal();const label=document.getElementById('version-label');if(label){label.textContent='Rascunho alterado';label.className='badge amber';}const badge=document.getElementById('draft-badge');if(badge)badge.textContent='Alterações locais';const impact=document.getElementById('impact-list');if(impact)impact.innerHTML=impacts();const length=document.getElementById('prompt-length');if(length&&key.endsWith('Prompt'))length.textContent=number(state.config[key].length)+' caracteres';validateConfig();}
function updateMatrix(){const n=counts();for(const [id,value]of Object.entries({'matrix-runs':n.runs,'matrix-configs':n.combinations,'matrix-docs':n.docs,'matrix-reps':state.matrix.repetitions,'matrix-texts':n.docs+' versões','matrix-vectors':'Até '+n.vectors})){const e=document.getElementById(id);if(e)e.textContent=value;}const error=n.runs===0?'Selecione pelo menos uma opção em cada eixo e um documento.':n.runs>600?'A demonstração permite até 600 runs. Reduza combinações ou repetições.':'';document.getElementById('matrix-error').textContent=error;document.getElementById('build-batch').disabled=Boolean(error);}
function combinations(){const m=state.matrix;const rows=[];for(const prompt of m.prompts)for(const model of m.models)for(const embedding of m.embeddings)for(const topk of m.topks)rows.push({prompt,model,embedding,topk:Number(topk)});return rows;}
function showDialog(title,body,footer='',wide=false){const d=document.getElementById('dialog');d.classList.toggle('wide',wide);document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-body').innerHTML=body;document.getElementById('dialog-footer').innerHTML=footer||btn('Fechar','close-dialog');if(!d.open)d.showModal();}
function closeDialog(){document.getElementById('dialog').close();}
function exportJson(content,name){const blob=new Blob([JSON.stringify({prototype:true,notice:'Configuração demonstrativa de UI/UX. Não representa execução ou medição real.',...content},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);notify('JSON demonstrativo exportado.');}
function setTab(next){if(validateConfig().length&&tab==='config'){notify('Revise os parâmetros antes de sair da configuração.');return;}page='experimentos';tab=next;render();}
function buildBatch(){const n=counts();if(!n.runs||n.runs>600)return;const jobs=[];for(const item of combinations())for(const document of state.matrix.documents)for(let r=1;r<=state.matrix.repetitions;r++)jobs.push({...item,document,repetition:r,id:'DEMO-'+String(jobs.length+1).padStart(3,'0'),status:'Na fila'});jobs[0].status='Em simulação';state.jobs=jobs;state.batchState='running';runPage=0;runFilter='';runSearch='';saveLocal();tab='runs';render();notify('Bateria simulada criada. Use “Avançar simulação” para percorrer os estados.');}
function runDetail(id){
  const r=state.jobs.find(x=>x.id===id);if(!r)return;
  const complete=r.status==='Concluída',timing=timingProfile('graph',r.document,'reuse');
  const pending=r.status==='Na fila'?'Aguardando início':r.status==='Cancelada'?'Sem duração final':'Em simulação; sem medição';
  showDialog(r.id+' · '+(r.document==='adpf54'?'ADPF 54':'Dom Casmurro'),`
    <div class="pillrow">${statusBadge(r.status)}<span class="badge amber">Tempos fictícios</span></div>
    <p style="margin-top:18px">${esc(r.model)} · ${esc(r.prompt)} · ${r.topk} trechos · repetição ${r.repetition}</p>
    <p class="meta">Nenhuma medição real produzida. As durações abaixo ilustram a tela; não são estimativas do modelo selecionado.</p>
    <div class="timing-summary" style="padding-left:0;padding-right:0">
      <div><strong>${complete?duration(timing.total):'—'}</strong><span>Total com fila e avaliação</span></div>
      <div><strong>${complete?duration(timing.active):'—'}</strong><span>Processamento desta run</span></div>
      <div><strong>${complete?duration(timing.queue):'—'}</strong><span>Espera na fila</span></div>
      <div><strong>${complete?duration(timing.evaluation):'—'}</strong><span>Avaliação</span></div>
    </div>
    <h3 style="margin:22px 0 12px">Tempo de cada etapa</h3>
    <div class="scroll" tabindex="0" role="region" aria-label="Tempos da execução"><table class="timing-table" id="run-stage-times"><thead><tr><th scope="col">Etapa</th><th scope="col">Duração nesta run</th><th scope="col">Estado / histórico</th></tr></thead><tbody>
      ${timing.rows.map(row=>`<tr data-stage-time="${row.id}" data-seconds="${complete?(row.seconds??''):''}"><td><strong>${row.label}</strong><small>${row.group}</small></td><td>${complete&&row.seconds!=null?row.seconds+' s':'—'}</td><td>${complete?row.status:pending}${complete&&row.status==='Reaproveitado'?'<small>Construção anterior: '+row.historical+' s</small>':''}</td></tr>`).join('')}
      <tr class="total-row"><td>Total de ponta a ponta</td><td id="run-time-total" data-seconds="${complete?timing.total:''}">${complete?timing.total+' s':'—'}</td><td>Inclui fila e avaliação</td></tr>
    </tbody></table></div>
    <div class="hint warning">${complete?'Cenário com índices prontos. O tempo histórico dos artefatos reaproveitados não é somado à duração desta run.':'Esta run ainda não tem uma duração final na demonstração. Tempo desconhecido aparece como “—”, não como zero.'} A simulação avança manualmente.</div>`,
    btn('Fechar','close-dialog')+btn('Abrir comparador de exemplo','dialog-compare','primary'),true);
}
function fieldDetail(id){const names={requerente:'Requerente',resultado:'Resultado',relator:'Relator',eventos:'Lista de eventos'};const a=adjusted(baseline),b=adjusted(candidate);const values={requerente:['Instituto Horizonte','Associação Aurora'],resultado:['Pedido rejeitado','Pedido acolhido'],relator:['Pessoa A','Pessoa A'],eventos:[['Evento A','Evento B'],['Evento A']]};const v=values[id];showDialog('Campo: '+names[id],`<div class="hint warning" style="margin-top:0">Todo o conteúdo abaixo é fictício, inclusive nomes e citações. Não é uma resposta sobre os PDFs reais.</div><div class="detailcols"><section class="answerbox"><span class="meta">Referência · ${a.name}</span><h3>Resposta</h3><pre>${esc(JSON.stringify(v[0],null,2))}</pre><p class="meta">Exemplo de evidência recuperada com contexto limitado.</p></section><section class="answerbox"><span class="meta">Candidata · ${b.name}</span><h3>Resposta</h3><pre>${esc(JSON.stringify(baseline===candidate?v[0]:v[1],null,2))}</pre><p class="meta">Exemplo de contexto que explicita papéis e relações.</p></section></div><h3>Evidência demonstrativa</h3><blockquote class="quote">A Associação Aurora apresentou o pedido inicial. O Instituto Horizonte solicitou participação em momento posterior.</blockquote><h3>Como a evidência chegaria ao leitor</h3><ol class="trail"><li><span class="marker">1</span><div>Busca textual e vetorial<small class="check-help">Candidatos e posições registrados por canal.</small></div></li><li><span class="marker">2</span><div>Expansão pelo grafo<small class="check-help">Entidade → papel → afirmação → trecho.</small></div></li><li><span class="marker">3</span><div>Resposta e verificação<small class="check-help">Formato, localização da citação e suporte semântico separados.</small></div></li></ol>`,btn('Fechar','close-dialog'),true);}
function help(){showDialog('Experimente o fluxo da plataforma',`<p>Este HTML é um protótipo navegável, inteiramente local. Resultados, custos, nomes de exemplo e execuções são fictícios.</p><ol class="trail">${[['Edite uma configuração','Mude o prompt ou modelo e confira o impacto nas etapas.'],['Salve uma versão','A fotografia fica apenas no armazenamento deste navegador.'],['Monte uma matriz','Selecione alternativas e veja a quantidade de runs mudar.'],['Simule e compare','Avance a fila manualmente e inspecione resultados ilustrativos.']].map(([a,b],i)=>`<li><span class="marker">${i+1}</span><div><strong>${a}</strong><small class="check-help">${b}</small></div></li>`).join('')}</ol><p class="meta">${persistence?'Armazenamento local disponível.':'Armazenamento local indisponível; alterações duram apenas nesta sessão.'} Não há conexão a OpenSearch, Neo4j, Ollama ou APIs externas neste protótipo.</p>`,btn('Restaurar demonstração','confirm-reset','danger')+btn('Continuar explorando','close-dialog','primary'));}
document.addEventListener('input',event=>{const e=event.target;if(e.dataset.config){const key=e.dataset.config;state.config[key]=e.type==='checkbox'?e.checked:e.type==='number'?Number(e.value):e.value;markChanged(key);}if(e.id==='repetitions'){state.matrix.repetitions=Math.max(1,Math.min(5,Math.floor(Number(e.value)||1)));saveLocal();updateMatrix();}if(e.id==='run-search'){runSearch=e.value;runPage=0;renderRunRows();}});
document.addEventListener('change',event=>{const e=event.target;if(e.dataset.config&&e.tagName==='SELECT'){state.config[e.dataset.config]=e.dataset.config==='dimension'?Number(e.value):e.value;if(e.dataset.config==='embedModel'&&e.value==='EmbeddingGemma:300m')state.config.dimension=768;markChanged(e.dataset.config);if(e.dataset.config==='embedModel')render();}if(e.dataset.axis){const key=e.dataset.axis;state.matrix[key]=e.checked?[...new Set([...state.matrix[key],e.value])]:state.matrix[key].filter(v=>v!==e.value);saveLocal();updateMatrix();}if(e.id==='run-filter'){runFilter=e.value;runPage=0;renderRunRows();}if(e.id==='compare-baseline'){baseline=e.value;render();}if(e.id==='compare-candidate'){candidate=e.value;render();}if(e.id==='compare-document'){compareDocument=e.value;render();}});
document.addEventListener('click',event=>{const e=event.target.closest('[data-action]');if(!e||e.disabled)return;const a=e.dataset.action;
if(a==='nav'){event.preventDefault();page=e.dataset.page;document.getElementById('sidebar').classList.remove('open');document.getElementById('shade').classList.remove('open');document.getElementById('menu-button').setAttribute('aria-expanded','false');render();}
else if(a==='tab')setTab(e.dataset.tab);
else if(a==='stage'){stage=e.dataset.stage;render();}
else if(a==='next-stage'){if(validateConfig().length)return;stage=stages[(stages.findIndex(x=>x[0]===stage)+1)%stages.length][0];render();}
else if(a==='edit-prompt'){page='experimentos';tab='config';stage=e.dataset.stage;render();}
else if(a==='save-version'){const errors=validateConfig();if(errors.length){notify(errors[0]);return;}state.config.version=Math.max(...state.versions.map(v=>v.version))+1;state.versions.push({version:state.config.version,name:state.config.name,note:'Salva neste navegador',config:clone(state.config)});state.dirty=false;saveLocal();render();notify('Versão '+state.config.version+' salva no protótipo local.');}
else if(a==='duplicate'){showDialog('Duplicar configuração',`<p>Crie um rascunho a partir das escolhas atuais. As versões salvas permanecem iguais.</p><label class="field"><span>Nome da configuração</span><input id="duplicate-name" type="text" maxlength="80" value="${esc(state.config.name+' · cópia')}"></label><div class="error" id="duplicate-error" role="alert"></div>`,btn('Cancelar','close-dialog')+btn('Criar rascunho','confirm-duplicate','primary'));}
else if(a==='confirm-duplicate'){const value=document.getElementById('duplicate-name').value.trim();if(!value){document.getElementById('duplicate-error').textContent='Informe um nome para a configuração.';return;}state.config.name=value;state.dirty=true;saveLocal();closeDialog();render();notify('Rascunho duplicado. Edite e salve uma nova versão.');}
else if(a==='preview-prompt'){showDialog('Prévia do pedido',`<p class="meta">Substituição demonstrativa das variáveis. Nenhum texto real é enviado a um modelo.</p><pre>${esc(state.config[e.dataset.key].replace(/\{\{passages\}\}/g,'[Trecho fictício: a Associação Aurora apresentou o pedido.]').replace(/\{\{schema\}\}/g,'{"type":"object","properties":{"value":{"type":"string"}}}').replace(/\{\{question\}\}/g,'Quem apresentou o pedido?').replace(/\{\{answer\}\}/g,'{"value":"Associação Aurora"}'))}</pre>`);}
else if(a==='schema'){showDialog('Entidades e relações · schema ilustrativo',`<p>Formato para revisar a experiência. A implementação validará cada campo e sua origem.</p><pre>${esc(JSON.stringify({entities:[{id:'entidade-1',name:'Associação Aurora',type:'organization',mentions:['trecho-1']}],relations:[{subject:'entidade-1',predicate:'apresentou',object:'pedido-inicial',role:'requerente',modality:'relato',speaker:null,date:null,evidence:{chunk_id:'trecho-1',quote:'A Associação Aurora apresentou o pedido inicial.'}}]},null,2))}</pre>`);}
else if(a==='reset-matrix'){state.matrix=clone(defaultMatrix);saveLocal();render();notify('Matriz demonstrativa restaurada.');}
else if(a==='preview-matrix'){const rows=combinations();showDialog('Combinações do experimento',`<p>${rows.length} configurações · ${counts().runs} runs considerando documentos e repetições.</p><div class="scroll"><table><thead><tr><th>Prompt</th><th>Modelo</th><th>Embedding</th><th>Trechos</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.prompt}</td><td>${r.model}</td><td>${r.embedding}</td><td>${r.topk}</td></tr>`).join('')||'<tr><td colspan="4">Selecione opções em todos os eixos.</td></tr>'}</tbody></table></div>`,btn('Fechar','close-dialog')+btn('Exportar JSON','export-matrix'),true);}
else if(a==='build-batch'){if(state.jobs.length)showDialog('Substituir a bateria de demonstração?',`<p>A fila ilustrativa atual será substituída pela matriz selecionada. Você pode exportar seu plano antes. Nenhum resultado real será afetado.</p>`,btn('Voltar','close-dialog')+btn('Substituir simulação','confirm-batch','primary'));else buildBatch();}
else if(a==='confirm-batch'){closeDialog();buildBatch();}
else if(a==='advance-batch'){if(state.batchState!=='running')return;const pending=state.jobs.filter(x=>x.status!=='Concluída');pending.slice(0,Math.ceil(state.jobs.length/4)).forEach(x=>x.status='Concluída');const next=state.jobs.find(x=>x.status!=='Concluída');if(next)next.status='Em simulação';else state.batchState='complete';saveLocal();render();notify(next?'Simulação avançou um grupo de execuções.':'Simulação concluída. Os resultados continuam sendo fictícios.');}
else if(a==='pause-batch'){state.batchState=state.batchState==='paused'?'running':'paused';saveLocal();render();}
else if(a==='cancel-batch'){state.jobs.forEach(x=>{if(x.status!=='Concluída')x.status='Cancelada';});state.batchState='cancelled';saveLocal();render();notify('Simulação cancelada. Execuções ilustrativas concluídas foram preservadas.');}
else if(a==='runs-prev'){runPage=Math.max(0,runPage-1);renderRunRows();}else if(a==='runs-next'){runPage++;renderRunRows();}
else if(a==='run-detail')runDetail(e.dataset.id);
else if(a==='dialog-compare'){closeDialog();setTab('compare');}
else if(a==='chart-select'){candidate=e.dataset.key;render();}
else if(a==='field-detail')fieldDetail(e.dataset.field);
else if(a==='cost-detail'){showDialog('Separar o custo de cada parte',`<span class="badge amber">Valores fictícios de UI</span><div class="scroll"><table><thead><tr><th>Parte</th><th>Exemplo</th><th>Tratamento</th></tr></thead><tbody><tr><td>Índice já construído</td><td>US$ 1,20</td><td>Custo histórico do artefato, sem nova cobrança</td></tr><tr><td>Extração desta run</td><td>US$ 0,29</td><td>Custo novo ilustrativo</td></tr><tr><td>Avaliação desta run</td><td>US$ 0,06</td><td>Custo novo, separado da extração</td></tr><tr><td>Hardware local</td><td>Não configurado</td><td>Não tratar como zero</td></tr></tbody></table></div><p>Na plataforma real, cada preço terá moeda, provedor e vigência; custos compartilhados não serão somados novamente em cada run.</p>`);}
else if(a==='graph-node'){graphNode=e.dataset.node;document.querySelectorAll('.graph-node').forEach(n=>n.setAttribute('aria-pressed',String(n.dataset.node===graphNode)));renderGraphDetail();}
else if(a==='versions'){showDialog('Versões salvas neste navegador',`<p>Selecione uma versão para carregar uma cópia como rascunho. Os registros salvos permanecem preservados.</p>${state.versions.map(v=>`<div class="version-row"><div><strong>${esc(v.name)} · v${v.version}</strong><p class="meta" style="margin:4px 0 0">${esc(v.note)}</p></div>${btn('Carregar cópia','load-version','',`data-version="${v.version}"`)}</div>`).join('')}`,btn('Exportar atual','export-config')+btn('Fechar','close-dialog'));}
else if(a==='load-version'){state.config=clone(state.versions.find(v=>v.version===Number(e.dataset.version)).config);state.dirty=true;saveLocal();closeDialog();page='experimentos';tab='config';render();notify('Versão carregada como rascunho editável.');}
else if(a==='export-config')exportJson({config:state.config},'configuracao-prototipo.json');
else if(a==='export-matrix')exportJson({config:state.config,matrix:state.matrix,counts:counts()},'matriz-prototipo.json');
else if(a==='questions'){showDialog('Perguntas e referências',`<p class="meta">Amostra de perguntas para demonstrar a interface. Gabaritos de avaliação não são enviados ao extrator.</p><div class="scroll"><table><thead><tr><th>Campo</th><th>Pergunta</th><th>Estado da referência</th></tr></thead><tbody>${(e.dataset.doc==='adpf54'?[['requerente','Quem apresentou o pedido inicial?'],['resultado','Qual foi o resultado da ação principal?'],['relator','Quem é o relator?']]:[['narrador','Quem narra a história?'],['personagens','Quais personagens participam deste acontecimento?'],['eventos','Quais eventos sustentam esta passagem?']]).map(([a,b])=>`<tr><td>${a}</td><td>${b}</td><td><span class="badge amber">Exemplo provisório</span></td></tr>`).join('')}</tbody></table></div>`);}
else if(a==='inspect-document'){showDialog('Inspeção da leitura',`<p>O comportamento planejado é comparar a página do PDF com texto, ordem de leitura e recortes.</p><div class="detailcols"><div class="answerbox"><h3>Página original</h3><p class="meta">Prévia ilustrativa</p><div class="paper" style="padding:16px;background:#f2f6f3"><i></i><i></i><i></i><i></i></div></div><div class="answerbox"><h3>Texto extraído</h3><p class="small">Exemplo fictício: a Associação Aurora apresentou o pedido inicial.</p><span class="badge">Página e offsets preservados</span></div></div><p class="meta" style="margin-top:18px">Nenhuma página foi processada pelo protótipo.</p>`,btn('Fechar','close-dialog')+btn('Configurar leitura','dialog-parse','primary'));}
else if(a==='dialog-parse'){closeDialog();page='experimentos';tab='config';stage='parse';render();}
else if(a==='import-document'){showDialog('Importar documentos',`<p>A plataforma funcional aceitará PDFs locais, verificará suas versões e preparará a leitura. Para este protótipo, os dois exemplos já estão na biblioteca.</p><div class="hint">A importação e o processamento de arquivos serão implementados no próximo estágio. Este HTML não envia documentos.</div>`);}
else if(a==='help')help();
else if(a==='confirm-reset'){showDialog('Restaurar a demonstração?',`<p>As versões e a fila salvas apenas neste protótipo serão removidas deste navegador. Os arquivos do projeto e os resultados da PoC permanecem intactos.</p>`,btn('Manter alterações','close-dialog')+btn('Restaurar demonstração','reset-demo','danger'));}
else if(a==='reset-demo'){state=defaults();saveLocal();page='experimentos';tab='config';stage='graph';closeDialog();render();notify('Demonstração restaurada.');}
else if(a==='close-dialog')closeDialog();
else if(a==='menu'){document.getElementById('sidebar').classList.add('open');document.getElementById('shade').classList.add('open');e.setAttribute('aria-expanded','true');}
else if(a==='close-menu'){document.getElementById('sidebar').classList.remove('open');document.getElementById('shade').classList.remove('open');document.getElementById('menu-button').setAttribute('aria-expanded','false');}
});
document.addEventListener('change',event=>{if(event.target.id==='timing-mode'){timingMode=event.target.value;const top=document.getElementById('tempos').getBoundingClientRect().top+scrollY;render();scrollTo(0,top);document.getElementById('timing-mode').focus({preventScroll:true});}});
document.addEventListener('keydown',event=>{if((event.key==='Enter'||event.key===' ')&&event.target.matches('g[role="button"]')){event.preventDefault();event.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}if(event.key==='Escape'){document.getElementById('sidebar').classList.remove('open');document.getElementById('shade').classList.remove('open');document.getElementById('menu-button').setAttribute('aria-expanded','false');}});
document.getElementById('brand-icon').innerHTML=icon('graph',24);document.getElementById('help-button').innerHTML=icon('help')+' Guia do protótipo';document.getElementById('plan-link').innerHTML=icon('file')+' Plano da plataforma';document.getElementById('local-icon').innerHTML=icon('monitor',16);document.getElementById('menu-button').innerHTML=icon('menu');document.getElementById('close-icon').innerHTML=icon('close');
function openTimingRoute(){if(location.hash==='#tempos'){page='experimentos';tab='compare';render();document.getElementById('tempos').scrollIntoView({block:'start'});}}
window.addEventListener('hashchange',openTimingRoute);
render();openTimingRoute();
</script>
</body></html>
